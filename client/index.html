<!DOCTYPE html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Canonical URL - MUST be https://clyr.shop (no www, no .at) -->
    <link rel="canonical" href="https://clyr.shop" />
    
    <!-- SEO: Explicit index directive (opposite of noindex) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <!-- Prevent Chrome's built-in auto-translate: it rewrites text nodes
         behind React's back and causes intermittent "removeChild" crashes.
         The app has its own EN/DE switcher, so browser translation isn't needed. -->
    <meta name="google" content="notranslate" />
    
    <!-- CLYR Brand Info -->
    <title>CLYR | Klares Wasser. Klares Leben. | Premium Wassersysteme</title>
    <meta name="description" content="CLYR - Premium Wassersysteme für reines, frisches Trinkwasser und erfrischende Duscherlebnisse. Home Soda Systeme und Aroma Duschen direkt zu Ihnen nach Hause. Versand in AT, DE, CH." />
    <meta name="keywords" content="Wassersystem, Trinkwasser, Soda, Sprudel, Aroma Dusche, Filter, CLYR, Premium Wasser, Wasseraufbereitung, Österreich" />
    <meta name="author" content="CLYR Solutions GmbH" />
    <meta name="language" content="de" />
    <meta http-equiv="Content-Language" content="de" />
    
    <!-- Open Graph / Social (updated to clyr.shop) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CLYR - Premium Wassersysteme" />
    <meta property="og:description" content="Klares Wasser. Klares Leben. Entdecken Sie unsere innovativen Wassersysteme für Ihr Zuhause." />
    <meta property="og:image" content="https://clyr.shop/images/clyr-logo.png" />
    <meta property="og:url" content="https://clyr.shop" />
    <meta property="og:site_name" content="CLYR" />
    <meta property="og:locale" content="de_DE" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CLYR - Premium Wassersysteme" />
    <meta name="twitter:description" content="Klares Wasser. Klares Leben. Premium Wassersysteme für Ihr Zuhause." />
    <meta name="twitter:image" content="https://clyr.shop/images/clyr-logo.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/clyr-logo.png" />
    <link rel="apple-touch-icon" href="/images/clyr-logo.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="msapplication-TileColor" content="#171717" />
    
    <!-- Trust / verification meta (helps corporate security scanners) -->
    <meta name="rating" content="general" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- JSON-LD: Organization (helps Google & security scanners trust the domain) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CLYR Solutions GmbH",
      "alternateName": "CLYR",
      "url": "https://clyr.shop",
      "logo": "https://clyr.shop/images/clyr-logo.png",
      "description": "Premium Wassersysteme für reines, frisches Trinkwasser und erfrischende Duscherlebnisse.",
      "email": "service@clyr.shop",
      "telephone": "+43 664 2520432",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Pappelweg 4b",
        "addressLocality": "Villach",
        "postalCode": "9524",
        "addressCountry": "AT"
      },
      "vatID": "ATU83027635",
      "sameAs": []
    }
    </script>
    
    <!-- JSON-LD: WebSite (enables sitelinks search box in Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CLYR",
      "url": "https://clyr.shop",
      "inLanguage": "de-DE",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://clyr.shop/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Prevent FOUC -->
    <style>
      body { 
        margin: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #fafafa;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
